# Public, credential-free qualification for the checked-out Workbench source.
# A green run covers the same execution, handoff, signed-Vela integration, and
# unsigned package-build gates used for the accepted v0.977.6 repin.
name: Workbench functional

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-functional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VELA_VERSION: "0.977.6"
      VELA_ARCHIVE_SHA256: 62ea9006e086b40f0431b2ce2cf74827518f37dc58e329353920083f50dad874
      VELA_BINARY_SHA256: 5b21415c98503b20518c0e68714b0b4f4b3c371525ea110563b89a53a0d3dbb3
      MATH_COMMIT: 3cbaa815b502183d9e2a2c5f91b0ede243f5f435
      MATH_TREE: 3a480711daa2376e401bf49abe75d63e353d0cc8
      MATH_REPOSITORY_ID: 3d012325-3768-4b95-a385-c94e9f2a57a6
      MATH_FIRST_AUTHORITY_RECORD_ROOT: sha256:efae3e02b5be6dfccf6701ebe26f87f00bb64f5b4372674e572a633844d95469
    steps:
      - name: Checkout Workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the repository toolchain pin
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Install the accepted Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Acquire and verify signed Vela
        run: |
          release_dir="$RUNNER_TEMP/vela-release"
          retained=fixtures/core/v0.977.6/release
          mkdir -p "$release_dir"
          base="https://github.com/vela-science/vela/releases/download/v${VELA_VERSION}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$release_dir/vela-macos-aarch64.zip" \
            "$base/vela-macos-aarch64.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$release_dir/vela-macos-aarch64.zip.release-manifest.json" \
            "$base/vela-macos-aarch64.zip.release-manifest.json"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$release_dir/vela-macos-aarch64.zip.release-manifest.json.sig" \
            "$base/vela-macos-aarch64.zip.release-manifest.json.sig"
          cmp "$release_dir/vela-macos-aarch64.zip.release-manifest.json" \
            "$retained/vela-macos-aarch64.zip.release-manifest.json"
          cmp "$release_dir/vela-macos-aarch64.zip.release-manifest.json.sig" \
            "$retained/vela-macos-aarch64.zip.release-manifest.json.sig"
          ssh-keygen -Y verify \
            -f "$retained/allowed_signers" \
            -I release@vela.space \
            -n vela-release \
            -s "$release_dir/vela-macos-aarch64.zip.release-manifest.json.sig" \
            < "$release_dir/vela-macos-aarch64.zip.release-manifest.json"
          test "$(shasum -a 256 "$release_dir/vela-macos-aarch64.zip" | awk '{print $1}')" \
            = "$VELA_ARCHIVE_SHA256"
          ditto -x -k "$release_dir/vela-macos-aarch64.zip" "$release_dir"
          test "$(shasum -a 256 "$release_dir/vela" | awk '{print $1}')" \
            = "$VELA_BINARY_SHA256"
          test "$("$release_dir/vela" --version)" = "vela ${VELA_VERSION}"

      - name: Prepare a complete public authority repository read
        env:
          VELA_EPHEMERAL_ACCOUNT_HOME: "1"
        run: |
          math="$RUNNER_TEMP/math"
          git clone https://github.com/vela-science/math.git "$math"
          git -C "$math" checkout --detach "$MATH_COMMIT"
          test "$(git -C "$math" rev-parse HEAD)" = "$MATH_COMMIT"
          test "$(git -C "$math" rev-parse HEAD^{tree})" = "$MATH_TREE"
          test -z "$(git -C "$math" status --porcelain --untracked-files=all)"
          trust="$HOME/.vela/trust/authorities/${MATH_REPOSITORY_ID}.json"
          test ! -e "$trust"
          VELA_ADVICE=0 "$RUNNER_TEMP/vela-release/vela" authority trust pin "$math" \
            --record-root "$MATH_FIRST_AUTHORITY_RECORD_ROOT" \
            --json > "$RUNNER_TEMP/math-trust-pin.json"
          test -f "$trust"

      - name: Execution, handoff, and signed-Vela integration
        run: bun run check

      - name: Live byte-preserving Workbench inspection
        env:
          VELA_WORKBENCH_SMOKE_REPO: ${{ runner.temp }}/math
          VELA_WORKBENCH_SMOKE_BINARY: ${{ runner.temp }}/vela-release/vela
        run: |
          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            commands::tests::live_full_git_and_vela_inspection_is_byte_preserving_when_requested \
            -- --exact

      - name: Format and normal Clippy gate
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --all-targets \
            --all-features

      - name: Locked unsigned application build
        run: CI=true bun run tauri build --no-bundle --no-sign -- --locked

      - name: Generated-contract and patch hygiene
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
